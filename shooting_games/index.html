<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シューティングゲーム集</title>
<style>
  :root{--bg:#0a0e1a;--card:#121a2e;--text:#e8eefc;--muted:#9ab;--accent:#6cf}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans JP",sans-serif;min-height:100%}
  .wrap{max-width:980px;margin:0 auto;padding:40px 20px}
  h1{margin:0 0 8px;font-size:32px;letter-spacing:2px;text-shadow:0 0 12px #06f}
  p{color:var(--muted);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  a.card{display:block;background:var(--card);color:var(--text);padding:18px;border:1px solid #234;border-radius:14px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .ico{font-size:36px;margin-bottom:8px}
  .ttl{font-size:18px;font-weight:700;margin-bottom:6px}
  .desc{color:var(--muted);font-size:13px;line-height:1.5}
  .key{display:inline-block;background:#234;color:#cdf;padding:2px 6px;border-radius:4px;font:11px monospace;margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚀 シューティングゲーム集</h1>
  <p>HTML 1ファイルで動く、3種のシューティングゲーム。スコアは LocalStorage に保存。</p>
  <div class="grid">
    <a class="card" href="space_shooter.html">
      <div class="ico">🛸</div>
      <div class="ttl">SPACE SHOOTER</div>
      <div class="desc">縦スクロール定番。自機下、敵上から。3way ショット、ライフ制、ウェーブ。<br><span class="key">← →</span><span class="key">Space</span></div>
    </a>
    <a class="card" href="asteroids.html">
      <div class="ico">🪨</div>
      <div class="ttl">ASTEROIDS</div>
      <div class="desc">回転＆慣性のクラシック。隕石を分裂させて撃破、ワープ可。<br><span class="key">↑</span><span class="key">← →</span><span class="key">Space</span><span class="key">H</span></div>
    </a>
    <a class="card" href="side_scroller.html">
      <div class="ico">🛩️</div>
      <div class="ttl">SIDE SCROLLER</div>
      <div class="desc">横スクロール。雑魚、戦車、高速機、ボス。パワーアップ＆ボム。<br><span class="key">矢印</span><span class="key">Space</span><span class="key">Shift</span></div>
    </a>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPACE SHOOTER｜縦スクロール</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:linear-gradient(#000,#001028);border:1px solid #234;box-shadow:0 0 40px #06f6 inset;image-rendering:pixelated;touch-action:none}
  .hud{position:fixed;top:8px;left:8px;font:14px/1.4 monospace;text-shadow:0 0 4px #0af}
  .hint{position:fixed;bottom:8px;left:8px;font:12px/1.4 monospace;color:#9cf;opacity:.8}
  .center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.6);text-align:center}
  .center h1{font-size:42px;margin:0 0 8px;color:#9cf;text-shadow:0 0 10px #06f}
  .center button{margin-top:14px;padding:10px 22px;font-size:16px;background:#06f;color:#fff;border:0;border-radius:8px;cursor:pointer}
  .hidden{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="480" height="720"></canvas></div>
<div class="hud">
  SCORE <span id="score">0</span> &nbsp; HI <span id="hi">0</span><br>
  LIFE  <span id="life">3</span> &nbsp; WAVE <span id="wave">1</span>
</div>
<div class="hint">← → 移動 / Space 射撃 / P 一時停止</div>

<div id="title" class="center">
  <h1>SPACE SHOOTER</h1>
  <div>← → で移動 / Space で射撃</div>
  <button id="startBtn">START</button>
</div>
<div id="over" class="center hidden">
  <h1>GAME OVER</h1>
  <div>SCORE <span id="finalScore">0</span></div>
  <button id="retryBtn">RETRY</button>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false});

let stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.3,v:Math.random()*2+.5}));
let player,bullets,enemies,particles,score,life,wave,enemyTimer,waveTimer,paused,gameState;
let hi=+localStorage.getItem('ss_hi')||0;
document.getElementById('hi').textContent=hi;

function reset(){
  player={x:W/2,y:H-60,w:28,h:30,cool:0,inv:60};
  bullets=[];enemies=[];particles=[];
  score=0;life=3;wave=1;enemyTimer=0;waveTimer=0;paused=false;gameState='play';
  updHUD();
}
function updHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('life').textContent=life;
  document.getElementById('wave').textContent=wave;
}
function spawnEnemy(){
  const type=Math.random()<.15&&wave>=2?'big':'small';
  if(type==='big'){
    enemies.push({x:Math.random()*(W-60)+30,y:-40,w:46,h:34,hp:3+wave,vx:(Math.random()-.5)*1.2,vy:1+wave*.15,type:'big',cool:60});
  }else{
    enemies.push({x:Math.random()*(W-40)+20,y:-30,w:24,h:22,hp:1,vx:(Math.random()-.5)*1.5,vy:1.5+wave*.2,type:'small',cool:90+Math.random()*60});
  }
}
function fireBullet(x,y,vy=-9,from='player'){
  bullets.push({x,y,w:4,h:10,vy,from});
}
function explode(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*15,color});
  }
}
function update(){
  if(paused||gameState!=='play')return;
  // stars
  for(const s of stars){s.y+=s.v;if(s.y>H){s.y=0;s.x=Math.random()*W}}
  // player
  if(keys['ArrowLeft'])player.x-=4.2;
  if(keys['ArrowRight'])player.x+=4.2;
  if(keys['ArrowUp'])player.y-=3.5;
  if(keys['ArrowDown'])player.y+=3.5;
  player.x=Math.max(15,Math.min(W-15,player.x));
  player.y=Math.max(40,Math.min(H-20,player.y));
  if(player.inv>0)player.inv--;
  if(player.cool>0)player.cool--;
  if(keys['Space']&&player.cool<=0){fireBullet(player.x,player.y-16);fireBullet(player.x-8,player.y-10);fireBullet(player.x+8,player.y-10);player.cool=12;}
  // wave/enemy spawn
  enemyTimer--;
  if(enemyTimer<=0){spawnEnemy();enemyTimer=Math.max(20,60-wave*4);}
  waveTimer++;
  if(waveTimer>=60*15){wave++;waveTimer=0;updHUD();}
  // bullets
  for(const b of bullets){b.y+=b.vy}
  // enemies
  for(const e of enemies){
    e.x+=e.vx;e.y+=e.vy;
    if(e.x<20||e.x>W-20)e.vx*=-1;
    e.cool--;
    if(e.cool<=0&&e.y<H-100){
      if(e.type==='big'){fireBullet(e.x,e.y+18,6,'enemy');fireBullet(e.x-12,e.y+12,5.5,'enemy');fireBullet(e.x+12,e.y+12,5.5,'enemy');}
      else fireBullet(e.x,e.y+12,5,'enemy');
      e.cool=e.type==='big'?100:160+Math.random()*80;
    }
  }
  // collisions: player bullets -> enemies
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.from!=='player')continue;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){
        bullets.splice(i,1);e.hp--;
        explode(b.x,b.y,4,'#ff6');
        if(e.hp<=0){enemies.splice(j,1);score+=e.type==='big'?500:100;explode(e.x,e.y,e.type==='big'?28:14,e.type==='big'?'#f84':'#fb6');updHUD();}
        break;
      }
    }
  }
  // enemy bullets -> player
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.from!=='enemy')continue;
    if(player.inv<=0&&Math.abs(b.x-player.x)<player.w/2&&Math.abs(b.y-player.y)<player.h/2){
      bullets.splice(i,1);hitPlayer();
    }
  }
  // enemy collide player
  for(const e of enemies){
    if(player.inv<=0&&Math.abs(e.x-player.x)<(e.w+player.w)/2-6&&Math.abs(e.y-player.y)<(e.h+player.h)/2-6){
      explode(e.x,e.y,20,'#f84');enemies.splice(enemies.indexOf(e),1);hitPlayer();
    }
  }
  // cull
  bullets=bullets.filter(b=>b.y>-20&&b.y<H+20);
  enemies=enemies.filter(e=>e.y<H+40);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life--}
  particles=particles.filter(p=>p.life>0);
}
function hitPlayer(){
  life--;updHUD();player.inv=90;explode(player.x,player.y,30,'#6cf');
  if(life<=0){gameOver();}
}
function gameOver(){
  gameState='over';
  if(score>hi){hi=score;localStorage.setItem('ss_hi',hi);document.getElementById('hi').textContent=hi;}
  document.getElementById('finalScore').textContent=score;
  document.getElementById('over').classList.remove('hidden');
}
function draw(){
  ctx.fillStyle='#000814';ctx.fillRect(0,0,W,H);
  // stars
  for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(s.s/2.5)+')';ctx.fillRect(s.x,s.y,s.s,s.s);}
  // particles
  for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=p.life/40;ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}
  ctx.globalAlpha=1;
  // bullets
  for(const b of bullets){
    ctx.fillStyle=b.from==='player'?'#9ef':'#f86';
    ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
  }
  // enemies
  for(const e of enemies){
    if(e.type==='big'){
      ctx.fillStyle='#c33';ctx.beginPath();ctx.ellipse(e.x,e.y,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fdb';ctx.fillRect(e.x-4,e.y-3,8,6);
    }else{
      ctx.fillStyle='#9b3';ctx.beginPath();ctx.moveTo(e.x,e.y+e.h/2);ctx.lineTo(e.x-e.w/2,e.y-e.h/2);ctx.lineTo(e.x+e.w/2,e.y-e.h/2);ctx.closePath();ctx.fill();
      ctx.fillStyle='#df8';ctx.fillRect(e.x-3,e.y-3,6,6);
    }
  }
  // player
  if(player.inv<=0||Math.floor(player.inv/4)%2===0){
    ctx.fillStyle='#6cf';ctx.beginPath();ctx.moveTo(player.x,player.y-15);ctx.lineTo(player.x-14,player.y+12);ctx.lineTo(player.x+14,player.y+12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(player.x-2,player.y-4,4,8);
    ctx.fillStyle='#fc6';ctx.fillRect(player.x-4,player.y+12,3,5);ctx.fillRect(player.x+1,player.y+12,3,5);
  }
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='32px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);}
}
let last=0;
function loop(t){
  update();draw();
  requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{if(e.code==='KeyP'&&gameState==='play')paused=!paused});

document.getElementById('startBtn').onclick=()=>{document.getElementById('title').classList.add('hidden');reset();};
document.getElementById('retryBtn').onclick=()=>{document.getElementById('over').classList.add('hidden');reset();};
reset();gameState='title';
requestAnimationFrame(loop);
</script>
</body>
</html>

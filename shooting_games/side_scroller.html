<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIDE SCROLLER｜横スクロール</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:linear-gradient(180deg,#0a1230,#180831);border:1px solid #75f;box-shadow:0 0 30px #a3f6 inset;touch-action:none}
  .hud{position:fixed;top:8px;left:8px;font:14px/1.4 monospace;color:#fcf;text-shadow:0 0 4px #f3f}
  .hint{position:fixed;bottom:8px;left:8px;font:12px/1.4 monospace;color:#dcf;opacity:.8}
  .center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.65);text-align:center}
  .center h1{font-size:42px;margin:0 0 8px;color:#fcf;text-shadow:0 0 10px #f3f;letter-spacing:4px}
  .center button{margin-top:14px;padding:10px 22px;font-size:16px;background:#a3f;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:700}
  .hidden{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="800" height="500"></canvas></div>
<div class="hud">
  SCORE <span id="score">0</span> &nbsp; HI <span id="hi">0</span><br>
  HP <span id="hp">100</span> &nbsp; STAGE <span id="stage">1</span>
</div>
<div class="hint">↑↓←→ 移動 / Space 射撃 / Shift ボム / P 一時停止</div>

<div id="title" class="center">
  <h1>SIDE SCROLLER</h1>
  <div>矢印で移動 / Space で射撃 / Shift でボム<br>右からくる敵をかわして撃つ</div>
  <button id="startBtn">START</button>
</div>
<div id="over" class="center hidden">
  <h1 id="overTitle">GAME OVER</h1>
  <div>SCORE <span id="finalScore">0</span></div>
  <button id="retryBtn">RETRY</button>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false});

let player,bullets,enemies,eb,particles,score,hp,stage,bombs,paused,gameState,time,boss,bossTimer;
let stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.4,v:Math.random()*3+.5,c:Math.random()<.3?'#fcf':'#fff'}));
let hi=+localStorage.getItem('ss2_hi')||0;
document.getElementById('hi').textContent=hi;

function reset(){
  player={x:90,y:H/2,w:34,h:22,cool:0,inv:60,power:1};
  bullets=[];enemies=[];eb=[];particles=[];score=0;hp=100;stage=1;bombs=3;paused=false;gameState='play';time=0;boss=null;bossTimer=60*30;
  updHUD();
}
function updHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('hp').textContent=Math.max(0,hp)+' / BOMB '+bombs;
  document.getElementById('stage').textContent=stage;
}
function spawnEnemy(){
  const r=Math.random();
  if(r<.55){
    enemies.push({type:'wave',x:W+30,y:Math.random()*(H-80)+40,w:30,h:24,hp:2,vx:-2.5,vy:0,t:Math.random()*Math.PI*2,cool:50+Math.random()*60});
  }else if(r<.85){
    enemies.push({type:'fast',x:W+30,y:Math.random()*(H-80)+40,w:24,h:18,hp:1,vx:-4.5,vy:(Math.random()-.5)*1.5,cool:9999});
  }else{
    enemies.push({type:'tank',x:W+30,y:Math.random()*(H-100)+50,w:44,h:32,hp:6,vx:-1.5,vy:0,cool:80});
  }
}
function spawnBoss(){
  boss={x:W+80,y:H/2,vx:-1,vy:0,w:120,h:90,hp:80+stage*30,cool:30,phase:0,t:0,enter:true};
}
function fire(x,y,vx,vy,from='player',w=6,h=4,color='#ff6'){bullets.push({x,y,vx,vy,from,w,h,color});}
function explode(x,y,n,color,sp=3){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp+.5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*25,color});}}
function bomb(){
  if(bombs<=0)return;bombs--;updHUD();
  explode(player.x,player.y,80,'#fff',6);
  for(const e of enemies){explode(e.x,e.y,20,'#fc6');e.hp-=4;score+=50;}
  enemies=enemies.filter(e=>e.hp>0);
  eb=[];
  if(boss){boss.hp-=40;explode(boss.x,boss.y,40,'#f6f');}
  updHUD();
}
function update(){
  if(paused||gameState!=='play')return;
  time++;bossTimer--;
  for(const s of stars){s.x-=s.v;if(s.x<0){s.x=W;s.y=Math.random()*H}}
  // player
  if(keys['ArrowLeft'])player.x-=4;
  if(keys['ArrowRight'])player.x+=4;
  if(keys['ArrowUp'])player.y-=4;
  if(keys['ArrowDown'])player.y+=4;
  player.x=Math.max(20,Math.min(W-20,player.x));
  player.y=Math.max(15,Math.min(H-15,player.y));
  if(player.inv>0)player.inv--;
  if(player.cool>0)player.cool--;
  if(keys['Space']&&player.cool<=0){
    fire(player.x+18,player.y,12,0,'player',8,3,'#9ef');
    if(player.power>=2){fire(player.x+12,player.y-6,11.5,-.6,'player',7,3,'#9ef');fire(player.x+12,player.y+6,11.5,.6,'player',7,3,'#9ef');}
    if(player.power>=3){fire(player.x+8,player.y,-8,0,'player',6,3,'#9ef');}
    player.cool=8;
  }
  if((keys['ShiftLeft']||keys['ShiftRight'])&&player.cool<99){bomb();player.cool=30;}
  // spawn
  if(!boss&&bossTimer>0&&time%Math.max(20,55-stage*4)===0)spawnEnemy();
  if(!boss&&bossTimer<=0){spawnBoss();bossTimer=99999;}
  // enemies
  for(const e of enemies){
    e.x+=e.vx;
    if(e.type==='wave'){e.t+=.08;e.y+=Math.sin(e.t)*2;}
    else{e.y+=e.vy;if(e.y<30||e.y>H-30)e.vy*=-1;}
    e.cool--;
    if(e.cool<=0&&e.x<W-20&&e.type!=='fast'){
      const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
      fire(e.x,e.y,dx/d*4,dy/d*4,'enemy',5,5,'#f86');
      e.cool=e.type==='tank'?70:120;
    }
  }
  // boss
  if(boss){
    if(boss.enter){boss.x+=boss.vx;if(boss.x<W-100){boss.enter=false;boss.vx=0;}}
    else{
      boss.t+=.02;boss.y=H/2+Math.sin(boss.t)*120;
      boss.cool--;
      if(boss.cool<=0){
        boss.phase=(boss.phase+1)%3;
        if(boss.phase===0){for(let k=-2;k<=2;k++)fire(boss.x-50,boss.y+k*8,-6,k*.6,'enemy',7,5,'#f3f');}
        else if(boss.phase===1){for(let k=0;k<12;k++){const a=k/12*Math.PI*2;fire(boss.x,boss.y,Math.cos(a)*4,Math.sin(a)*4,'enemy',6,6,'#fa3');}}
        else{const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;for(let k=-1;k<=1;k++)fire(boss.x-30,boss.y,dx/d*5,(dy+k*30)/d*5,'enemy',8,4,'#fc6');}
        boss.cool=50;
      }
    }
  }
  // bullets
  for(const b of bullets){b.x+=b.vx;b.y+=b.vy}
  // collisions: player bullets -> enemies / boss
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];if(b.from!=='player')continue;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){
        bullets.splice(i,1);e.hp--;explode(b.x,b.y,4,'#ff6');
        if(e.hp<=0){enemies.splice(j,1);score+=e.type==='tank'?300:e.type==='fast'?150:100;explode(e.x,e.y,16,'#fc6');if(Math.random()<.07)player.power=Math.min(3,player.power+1);updHUD();}
        break;
      }
    }
    if(boss&&!boss.enter&&Math.abs(b.x-boss.x)<boss.w/2&&Math.abs(b.y-boss.y)<boss.h/2){
      bullets.splice(i,1);boss.hp--;explode(b.x,b.y,3,'#ff6');
      if(boss.hp<=0){explode(boss.x,boss.y,120,'#f6f',7);score+=5000;stage++;bossTimer=60*30;boss=null;player.power=Math.min(3,player.power+1);updHUD();break;}
    }
  }
  // enemy bullets -> player
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];if(b.from!=='enemy')continue;
    if(player.inv<=0&&Math.abs(b.x-player.x)<player.w/2&&Math.abs(b.y-player.y)<player.h/2){
      bullets.splice(i,1);hitPlayer(8);
    }
  }
  // enemy collide player
  for(const e of enemies){
    if(player.inv<=0&&Math.abs(e.x-player.x)<(e.w+player.w)/2-6&&Math.abs(e.y-player.y)<(e.h+player.h)/2-6){
      explode(e.x,e.y,16,'#fc6');enemies.splice(enemies.indexOf(e),1);hitPlayer(20);
    }
  }
  // boss collide
  if(boss&&!boss.enter&&player.inv<=0&&Math.abs(player.x-boss.x)<(player.w+boss.w)/2-10&&Math.abs(player.y-boss.y)<(player.h+boss.h)/2-10){
    hitPlayer(30);
  }
  bullets=bullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
  enemies=enemies.filter(e=>e.x>-50);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life--}
  particles=particles.filter(p=>p.life>0);
}
function hitPlayer(dmg){
  hp-=dmg;player.inv=60;explode(player.x,player.y,18,'#6cf');
  if(player.power>1&&Math.random()<.4)player.power--;
  updHUD();
  if(hp<=0){gameState='over';if(score>hi){hi=score;localStorage.setItem('ss2_hi',hi);document.getElementById('hi').textContent=hi;}document.getElementById('overTitle').textContent='GAME OVER';document.getElementById('finalScore').textContent=score;document.getElementById('over').classList.remove('hidden');}
}
function draw(){
  // bg
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1230');g.addColorStop(1,'#1a0833');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle=s.c;ctx.globalAlpha=s.s/2.5;ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  // particles
  for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}
  ctx.globalAlpha=1;
  // bullets
  for(const b of bullets){ctx.fillStyle=b.color;ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);}
  // enemies
  for(const e of enemies){
    if(e.type==='tank'){ctx.fillStyle='#a33';ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);ctx.fillStyle='#fdb';ctx.fillRect(e.x-6,e.y-4,12,8);}
    else if(e.type==='fast'){ctx.fillStyle='#fa6';ctx.beginPath();ctx.moveTo(e.x-e.w/2,e.y);ctx.lineTo(e.x+e.w/2,e.y-e.h/2);ctx.lineTo(e.x+e.w/2,e.y+e.h/2);ctx.closePath();ctx.fill();}
    else{ctx.fillStyle='#7b7';ctx.beginPath();ctx.ellipse(e.x,e.y,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x-3,e.y-3,6,6);}
  }
  // boss
  if(boss){
    ctx.fillStyle='#a3a';ctx.fillRect(boss.x-boss.w/2,boss.y-boss.h/2,boss.w,boss.h);
    ctx.fillStyle='#f8f';ctx.fillRect(boss.x-boss.w/2+10,boss.y-10,boss.w-20,20);
    ctx.fillStyle='#000';ctx.fillRect(boss.x-30,boss.y-4,12,8);ctx.fillRect(boss.x+18,boss.y-4,12,8);
    // hp bar
    ctx.fillStyle='#400';ctx.fillRect(40,16,W-80,8);
    ctx.fillStyle='#f3f';ctx.fillRect(40,16,(W-80)*Math.max(0,boss.hp)/(80+stage*30),8);
  }
  // player
  if(player.inv<=0||Math.floor(player.inv/4)%2===0){
    ctx.fillStyle='#6cf';ctx.beginPath();ctx.moveTo(player.x+18,player.y);ctx.lineTo(player.x-14,player.y-11);ctx.lineTo(player.x-8,player.y);ctx.lineTo(player.x-14,player.y+11);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(player.x,player.y-2,8,4);
    ctx.fillStyle='#fc6';ctx.fillRect(player.x-17,player.y-3,4,2);ctx.fillRect(player.x-17,player.y+1,4,2);
  }
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='32px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);}
}
function loop(){update();draw();requestAnimationFrame(loop);}
addEventListener('keydown',e=>{if(e.code==='KeyP'&&gameState==='play')paused=!paused});
document.getElementById('startBtn').onclick=()=>{document.getElementById('title').classList.add('hidden');reset();};
document.getElementById('retryBtn').onclick=()=>{document.getElementById('over').classList.add('hidden');reset();};
reset();gameState='title';
requestAnimationFrame(loop);
</script>
</body>
</html>

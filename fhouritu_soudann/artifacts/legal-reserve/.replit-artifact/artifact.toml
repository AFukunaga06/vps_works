kind = "web"
previewPath = "/"
title = "フクの相談窓口 - 法律相談予約"
version = "1.0.0"
id = "artifacts/legal-reserve"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25518

[services.development]
run = "pnpm --filter @workspace/legal-reserve run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legal-reserve", "run", "build" ]
publicDir = "artifacts/legal-reserve/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25518"
BASE_PATH = "/"

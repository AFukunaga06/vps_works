<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持ち物リスト</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body>
  <div id="app">
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1 class="title">持ち物リスト</h1>
      </header>

      <!-- Control Panel -->
      <div class="control-panel">
        <div class="control-group">
          <input type="text" id="newItemInput" placeholder="新しい項目を入力" class="input-field" />
          <button id="addItemBtn" class="btn btn-primary">追加</button>
        </div>

        <div class="control-group">
          <button id="prevBtn" class="btn btn-secondary">← 前へ</button>
          <button id="todayBtn" class="btn btn-secondary">今日</button>
          <button id="nextBtn" class="btn btn-secondary">次へ →</button>
        </div>

        <div class="control-group">
          <label for="daysSelect">表示日数:</label>
          <select id="daysSelect" class="select-field">
            <option value="1">1日</option>
            <option value="2" selected>2日</option>
            <option value="7">7日</option>
            <option value="14">14日</option>
            <option value="30">30日</option>
          </select>
        </div>

        <div class="action-buttons">
          <button id="clearChecksBtn" class="btn btn-danger">チェック項目全て削除</button>
          <button id="checkAllBtn" class="btn btn-blue">チェックする</button>
          <button id="saveBtn" class="btn btn-green">保存する</button>
          <button id="confirmItemBtn" class="btn btn-purple">項目確定</button>
          <button id="renameItemBtn" class="btn btn-yellow">物品名変更</button>
          <button id="resetBtn" class="btn btn-gray">リセット</button>
          <button id="insertRowBtn" class="btn btn-orange">行の挿入</button>
          <button id="deleteRowBtn" class="btn btn-danger">行の削除</button>
          <span id="saveMessage" style="display: none; margin-left: 12px; color: #16a34a; font-weight: 600; align-self: center;">保存されました</span>
        </div>
      </div>

      <!-- Main Grid -->
      <div class="grid-container">
        <table class="checklist-grid" id="checklistTable">
          <thead>
            <tr id="headerRow">
              <!-- populated by JavaScript -->
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Rows will be populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
